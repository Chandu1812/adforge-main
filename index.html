<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AdForge | Stop Guessing. Start Selling.</title>
    <meta name="description" content="Launch a brand that looks real and converts — in days, not months." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              heading: ['Poppins', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              primary: {
                DEFAULT: '#0F62FE', // Vivid Indigo
                hover: '#0043CE',
              },
              accent: {
                DEFAULT: '#FF7A59', // Warm Coral
                light: '#FFB3A0',
              },
              neutral: {
                900: '#0B1220', // Deep Ink
                700: '#374151', // Body text
                400: '#9CA3AF', // Muted
                50: '#FBFBFD',  // Soft Off-white surface
              }
            },
            animation: {
              'shimmer': 'shimmer 8s linear infinite',
              'pulse-soft': 'pulse-soft 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'spin-slow': 'spin 12s linear infinite',
            },
            keyframes: {
              shimmer: {
                '0%': { backgroundPosition: '200% 0' },
                '100%': { backgroundPosition: '-200% 0' }
              },
              'pulse-soft': {
                '0%, 100%': { opacity: 1 },
                '50%': { opacity: .7 }
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      
      html {
        scroll-behavior: smooth;
      }
    </style>

  }
}
</script>
